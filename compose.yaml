services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_PUBLIC: "1"
      APP_ALLOWED_ORIGINS: "https://${APP_DOMAIN:?请设置域名}"
      APP_DEMO_PASSWORD: "${APP_DEMO_PASSWORD:?请设置评审密码}"
      APP_TASK_TIMEOUT: "180"
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?请设置域名}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
